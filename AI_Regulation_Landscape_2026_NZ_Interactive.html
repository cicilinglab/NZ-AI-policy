.eyebrow,.subtitle{display:none}

.cell-content{grid-template-columns:1fr}

.matrix-scroll.fit-view .bar-meta{display:flex;margin-top:4px}

body.full-page .page{position:fixed;inset:0;z-index:80;width:100%;max-width:none;height:100vh;padding:10px;background:#fff}body.full-page .masthead{display:none}body.full-page .controls{margin-top:0}body.full-page .matrix-shell{margin-top:9px}.empty{display:none;padding:50px 20px;text-align:center;color:var(--muted)}.empty.visible{display:block}
.modal-backdrop{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(16,20,28,.55)}.modal-backdrop.open{display:flex}.modal{position:relative;width:min(760px,100%);max-height:calc(100vh - 36px);overflow:auto;border-radius:18px;background:#fff;padding:24px;box-shadow:0 28px 90px rgba(0,0,0,.28)}.modal.nz-modal{border:4px solid var(--nz)}.modal-close{position:absolute;top:13px;right:13px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:21px}.modal-kicker{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-right:52px}.modal-chip{padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}.modal-chip.nz{color:#fff;background:var(--nz)}.modal-chip.group{color:#40454e;background:#f0f2f5}.modal-chip.binding{color:#286c3b;background:var(--binding-bg)}.modal-chip.proposed{color:#816000;background:var(--proposed-bg)}.modal-chip.guidance{color:#226c85;background:var(--guidance-bg)}.modal-chip.institutional{color:#5d4294;background:var(--institutional-bg)}.modal-chip.mixed{color:#263f53;background:var(--mixed-bg)}.modal-chip.none{color:#666d77;background:var(--none-bg)}.modal h2{margin:17px 50px 7px 0;font-size:clamp(27px,4vw,40px);line-height:1.06;letter-spacing:-.04em}.modal-country{color:var(--muted);font-size:17px;font-weight:760}.modal-scope{margin:19px 0 0;padding:13px 15px;border-radius:12px;background:#f6f7f9}.modal-scope b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em}.modal-desc{margin:18px 0;font-size:16px;line-height:1.62}.modal-def{padding-top:15px;border-top:1px solid var(--line);color:#555a63;font-size:13px}.source-title{margin:20px 0 9px;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.source-list{display:grid;gap:8px}.modal-source{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 13p <body>
<div class="page">
  <header class="masthead">
    <div>
      <div class="eyebrow">Comparative policy evidence map</div>
      <h1>Landscape of AI Regulation <span class="year">2026</span></h1>
      <p class="subtitle">Six jurisdictions · snapshot 30 September 2026 · click any bar for evidence and official references</p>
    </div>
    <div class="nz-key"><b>NZ</b> Aotearoa New Zealand highlighted</div>
  </header>

  <section class="controls" aria-label="Interactive controls">
    <div class="control-grid">
      <input id="search" class="field" type="search" placeholder="Search criteria, notes, or instruments…" aria-label="Search the matrix" />
      <select id="countrySelect" class="field" aria-label="Show jurisdiction">
        <option value="all">All jurisdictions</option>
      </select>
      <div class="toggle-group">
        <button id="nzSpotlight" class="toggle" aria-pressed="true">NZ spotlight</button>
        <button id="nzOnly" class="toggle" aria-pressed="false">NZ only</button>
      </div>
      <div class="action-group">
        <button id="sourcesBtn" class="action">Sources</button>
        <button id="fullPage" class="action">Full page</button>
        <button id="printBtn" class="action">Print / PDF</button>
        <button id="resetBtn" class="action primary">Reset</button>
      </div>
    </div>
    <div class="tools-row">
      <div class="zoom-tools">
        <button id="zoomOut" class="zoom-button" aria-label="Zoom out">−</button>
        <input id="zoomRange" class="zoom-range" type="range" min="35" max="180" step="5" value="100" aria-label="Zoom level" />
        <button id="zoomIn" class="zoom-button" aria-label="Zoom in">+</button>
        <span id="zoomReadout" class="zoom-readout">100%</span>
        <button id="fitBtn" class="fit-button" aria-pressed="true">Fit overview</button>
        <span id="zoomMode" class="zoom-mode">Overview</span>
      </div>
      <div class="status-tools" aria-label="Legal force filters">
        <button class="status-filter" data-force="binding" aria-pressed="true"><span class="swatch binding"></span>Binding</button>
        <button class="status-filter" data-force="proposed" aria-pressed="true"><span class="swatch proposed"></span>Proposed</button>
        <button class="status-filter" data-force="guidance" aria-pressed="true"><span class="swatch guidance"></span>Guidance</button>
        <button class="status-filter" data-force="institutional" aria-pressed="true"><span class="swatch institutional"></span>Institutional</button>
        <button class="status-filter" data-force="mixed" aria-pressed="true"><span class="swatch mixed"></span>Mixed</button>
        <button class="status-filter" data-force="none" aria-pressed="true"><span class="swatch none"></span>Not identified</button>
      </div>
    </div>
  </section>

  <section id="matrixShell" class="matrix-shell zoom-overview nz-spotlight">
    <div class="shell-top"><span id="resultCount" class="result-count"></span><span id="visibleMode">All six jurisdictions</span></div>
    <div id="matrixScroll" class="matrix-scroll fit-view">
      <div id="matrixInner" class="matrix-inner"></div>
      <div id="emptyState" class="empty">No criteria match the current search and filters.</div>
    </div>
  </section>
</div>

<div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button id="modalClose" class="modal-close" aria-label="Close">×</button>
    <div id="modalBody"></div>
  </div>
</div>

function buildTable(){
 const groupCounts={}; DATA.rows.forEach(r=>groupCounts[r.group]=(groupCounts[r.group]||0)+1);
 let h='<table class="matrix"><colgroup><col class="group"><col class="criterion">'+DATA.countries.map(()=>'<col class="country">').join('')+'</colgroup><thead><tr><th class="corner-group">Dimension</th><th class="corner-criterion">Criterion</th>';
 for(const c of DATA.countries){h+=`<th class="country-head ${c.isNZ?'is-nz':''}" data-country-head="${c.id}"><span class="country-name">${esc(c.short)}</span><span class="country-sub">${esc(c.name)}</span></th>`}
 h+='</tr></thead><tbody>';
 let currentGroup='';
 for(const row of DATA.rows){
   h+=`<tr data-row="${row.id}" data-group="${esc(row.group)}">`;
   if(row.group!==currentGroup){h+=`<th class="group-cell" rowspan="${groupCounts[row.group]}">${esc(row.group)}</th>`;currentGroup=row.group}
   h+=`<th class="criterion-cell"><div class="criterion-title">${esc(row.criterion)}</div><div class="criterion-def">${esc(row.definition)}</div></th>`;
   for(const country of DATA.countries){
     const cell=DATA.matrix[country.id][row.id];
     h+=`<td class="data-cell ${country.isNZ?'is-nz':''}" data-country="${country.id}" data-row-cell="${row.id}" data-force="${cell.force}" data-search="${esc((row.group+' '+row.criterion+' '+row.definition+' '+country.name+' '+cell.note+' '+cell.refs.map(k=>DATA.sources[k].title).join(' ')).toLowerCase())}">
       <div class="cell-content">
         <button class="bar-button force-${cell.force}" data-open="${country.id}|${row.id}" aria-label="${esc(country.name+': '+row.criterion+', '+scopeLabels[cell.scope]+', '+forceLabels[cell.force])}">
           <div class="bar-track"><div class="bar-fill" style="width:${scopeWidths[cell.scope]}%"></div></div>
           <div class="bar-meta"><span class="scope-label">${scopeLabels[cell.scope]}</span><span class="force-pill ${cell.force}" title="${esc(forceLabels[cell.force])}">${forceShortLabels[cell.force]}</span></div>
           <div class="cell-note">${esc(cell.note)}</div>
         </button>
       </div>
     </td>`;
   }
   h+='</tr>';
 }
 h+='</tbody></table>';
 els.inner.innerHTML=h;
 els.inner.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{const [c,r]=b.dataset.open.split('|');openCell(c,r)}));
}

function render(){
 const q=state.query.trim().toLowerCase(); let visibleRows=0, visibleCells=0;
 document.body.classList.toggle('nz-only',state.nzOnly);
 els.shell.classList.toggle('nz-spotlight',state.nzSpotlight && !state.nzOnly);
 for(const row of DATA.rows){
   const tr=els.inner.querySelector(`tr[data-row="${row.id}"]`); let rowMatch=false;
   for(const country of DATA.countries){
     const td=tr.querySelector(`[data-country="${country.id}"]`); const cell=DATA.matrix[country.id][row.id];
     const countryVisible=(state.nzOnly?country.id==='nz':(state.country==='all'||state.country===country.id));
     td.classList.toggle('is-hidden-country',!countryVisible);
     const forceVisible=state.activeForces.has(cell.force);
     const searchVisible=!q||td.dataset.search.includes(q);
     const cellVisible=countryVisible&&forceVisible&&searchVisible;
     td.classList.toggle('is-muted',countryVisible&&!cellVisible);
     if(cellVisible){rowMatch=true;visibleCells++}
   }
   tr.classList.toggle('row-hidden',!rowMatch); if(rowMatch)visibleRows++;
 }
 for(const country of DATA.countries){
   const head=els.inner.querySelector(`[data-country-head="${country.id}"]`); const show=state.nzOnly?country.id==='nz':(state.country==='all'||state.country===country.id); head.classList.toggle('is-hidden-country',!show);
 }
 els.empty.classList.toggle('visible',visibleRows===0); els.resultCount.textContent=`${visibleRows} criteria · ${visibleCells} visible evidence cells`;
 els.nzSpotlight.setAttribute('aria-pressed',String(state.nzSpotlight)); els.nzOnly.setAttribute('aria-pressed',String(state.nzOnly));
 els.visibleMode.textContent=state.nzOnly?'New Zealand only':(state.country==='all'?'All six jurisdictions':DATA.countries.find(c=>c.id===state.country).name);
 requestAnimationFrame(()=>{if(state.fit)fitMatrix()});
}

function setZoom(z,fromFit=false){
 state.zoom=Math.max(.35,Math.min(1.8,z)); if(!fromFit){fitRequest++;state.fit=false;els.fitBtn.setAttribute('aria-pressed','false');els.scroll.classList.remove('fit-view')}
 els.inner.style.zoom=state.zoom; els.zoomRange.value=Math.round(state.zoom*100); els.zoomReadout.textContent=Math.round(state.zoom*100)+'%';
 els.shell.classList.remove('zoom-overview','zoom-standard','zoom-detail');
 let mode='Overview'; if(state.zoom<1){els.shell.classList.add('zoom-overview')} else if(state.zoom<1.25){els.shell.classList.add('zoom-standard');mode='Standard'} else {els.shell.classList.add('zoom-detail');mode='Detail'}
 els.zoomMode.textContent=mode;
}
function fitMatrix(){
 const requestId=++fitRequest;
 state.fit=true;els.fitBtn.setAttribute('aria-pressed','true');els.scroll.classList.add('fit-view');els.inner.style.zoom=1;
 els.shell.classList.remove('zoom-overview','zoom-standard','zoom-detail');els.shell.classList.add('zoom-overview');
 requestAnimationFrame(()=>{
   if(requestId!==fitRequest)return;
   const availW=Math.max(100,els.scroll.clientWidth-8);
   const overviewW=els.inner.offsetWidth||1;
   const overviewZoom=Math.min(.98,availW/overviewW);
   setZoom(Math.max(.35,overviewZoom),true);els.scroll.scrollTo({left:0,top:0});
 });
}
function openCell(countryId,rowId){
 const country=DATA.countries.find(c=>c.id===countryId), row=DATA.rows.find(r=>r.id===rowId), cell=DATA.matrix[countryId][rowId];
 els.modal.classList.toggle('nz-modal',country.isNZ);
 const refs=cell.refs.map(k=>{const s=DATA.sources[k];return `<a class="modal-source" href="${esc(s.url)}" target="_blank" rel="noopener"><span>${esc(s.title)}</span><span>Open source</span></a>`}).join('');
 els.modalBody.innerHTML=`<div class="modal-kicker">${country.isNZ?'<span class="modal-chip nz">NZ highlighted</span>':''}<span class="modal-chip group">${esc(row.group)}</span><span class="modal-chip ${cell.force}">${esc(forceLabels[cell.force])}</span></div><h2 id="modalTitle">${esc(row.criterion)}</h2><div class="modal-country">${esc(country.name)}</div><div class="modal-scope"><b>Documented coverage</b>${esc(scopeLabels[cell.scope])}</div><p class="modal-desc">${esc(cell.note)}</p><div class="modal-def"><b>Criterion:</b> ${esc(row.definition)}</div><div class="source-title">Official references</div><div class="source-list">${refs}</div>`;
 openModal();
}
function openSources(){
 const cards=DATA.countries.map(c=>{const keys=[...new Set(DATA.rows.flatMap(r=>DATA.matrix[c.id][r.id].refs))];const links=keys.map(k=>{const s=DATA.sources[k];return `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`}).join('');return `<section class="source-card ${c.isNZ?'nz-source':''}"><h3>${esc(c.name)}${c.isNZ?' · highlighted':''}</h3>${links}</section>`}).join('');
 els.modal.classList.remove('nz-modal');els.modalBody.innerHTML=`<div class="modal-kicker"><span class="modal-chip group">Source index</span></div><h2 id="modalTitle">Official external references</h2><p class="modal-desc">References are grouped by jurisdiction. Individual cells link to the sources most directly supporting that classification.</p><div class="source-index">${cards}</div>`;openModal();
}
function openModal(){els.backdrop.classList.add('open');els.backdrop.setAttribute('aria-hidden','false');els.modalClose.focus()}
function closeModal(){els.backdrop.classList.remove('open');els.backdrop.setAttribute('aria-hidden','true')}

els.search.addEventListener('input',e=>{state.query=e.target.value;render()});els.countrySelect.addEventListener('change',e=>{state.country=e.target.value;state.nzOnly=false;render()});
els.nzSpotlight.addEventListener('click',()=>{state.nzSpotlight=!state.nzSpotlight;render()});els.nzOnly.addEventListener('click',()=>{state.nzOnly=!state.nzOnly;if(state.nzOnly){state.country='all';els.countrySelect.value='all'}render()});
document.querySelectorAll('.status-filter').forEach(b=>b.addEventListener('click',()=>{const f=b.dataset.force;if(state.activeForces.has(f))state.activeForces.delete(f);else state.activeForces.add(f);b.setAttribute('aria-pressed',String(state.activeForces.has(f)));render()}));
els.zoomOut.addEventListener('click',()=>setZoom(state.zoom-.1));els.zoomIn.addEventListener('click',()=>setZoom(state.zoom+.1));els.zoomRange.addEventListener('input',e=>setZoom(Number(e.target.value)/100));els.fitBtn.addEventListener('click',()=>{if(state.fit){state.fit=false;els.fitBtn.setAttribute('aria-pressed','false');els.scroll.classList.remove('fit-view');setZoom(Math.max(.8,state.zoom))}else fitMatrix()});
els.scroll.addEventListener('wheel',e=>{if((e.ctrlKey||e.metaKey)){e.preventDefault();setZoom(state.zoom+(e.deltaY<0?.08:-.08))}},{passive:false});
els.sourcesBtn.addEventListener('click',openSources);els.fullPage.addEventListener('click',()=>{document.body.classList.toggle('full-page');els.fullPage.textContent=document.body.classList.contains('full-page')?'Exit full page':'Full page';requestAnimationFrame(()=>{if(state.fit)fitMatrix()})});els.printBtn.addEventListener('click',()=>window.print());
els.resetBtn.addEventListener('click',()=>{state.query='';state.country='all';state.nzSpotlight=true;state.nzOnly=false;state.activeForces=new Set(Object.keys(forceLabels));els.search.value='';els.countrySelect.value='all';document.querySelectorAll('.status-filter').forEach(b=>b.setAttribute('aria-pressed','true'));render();fitMatrix()});
els.modalClose.addEventListener('click',closeModal);els.backdrop.addEventListener('click',e=>{if(e.target===els.backdrop)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('resize',()=>{if(state.fit)fitMatrix()});

buildTable();render();
</script>
</body>
</html>
